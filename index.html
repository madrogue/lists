<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Lists</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <script src="assets/js/handlebars.min.js"></script>
</head>

<body>
  <div id="app">
    <div id="header-main" class="header">
      <div class="header-select-wrap">
        <div id="listColorSwatch" class="list-color-swatch"></div>
        <select id="listSelect"></select>
        <span id="completionCount" class="completion-count"></span>
      </div>
      <button id="addList" class="add-btn" aria-label="Add list"><i class="fas fa-add"></i></button>
      <button id="editList" aria-label="Edit list"><i class="fas fa-edit"></i></button>
      <button id="toggleDelete" class="delete-btn" aria-label="Toggle delete mode"><i class="fas fa-trash"></i></button>
      <button id="toggleReorder" class="reorder-btn" aria-label="Toggle reorder mode"><i class="fas fa-sort"></i></button>
      <button id="showSettings" aria-label="Settings"><i class="fas fa-cog"></i></button>
    </div>
    <div id="list" class="list-container">
      <div id="listContainer"></div>
      <div class="add-item-container">
        <input type="text" id="newItemInput" placeholder="Add item">
        <button id="addNewItem" class="add-btn" aria-label="Add item"><i class="fas fa-add"></i></button>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay"></div>

  <!-- Edit List Popup -->
  <div id="popup-edit-list" class="popup">
    <div class="popup-header">
      <div class="popup-title">Edit List</div>
      <button id="closeEditListPopup" class="close-btn"><i class="fas fa-times"></i></button>
    </div>
    <div class="popup-content">
      <label for="listName">Name:</label>
      <input type="text" id="listName" placeholder="List name">
      <label for="listColor">Color:</label>
      <input type="color" id="listColor" name="listColor">
      <button id="saveList" class="save-btn"><i class="fas fa-save"></i> Save</button>
      <button id="deleteList" class="delete-btn"><i class="fas fa-trash"></i> Delete</button>
    </div>
  </div>

  <!-- Settings Popup -->
  <div id="popup-settings" class="popup">
    <div class="popup-header">
      <div class="popup-title">Settings</div>
      <button id="closeSettingsPopup" class="close-btn"><i class="fas fa-times"></i></button>
    </div>
    <div class="popup-content">
      <button id="sortCompleted"><i class="fas fa-sort-down"></i> Sort completed to bottom</button>
      <button id="clearCompleted" class="delete-btn"><i class="fas fa-trash"></i> Clear completed</button>
      <button id="clearAll" class="delete-btn"><i class="fas fa-trash"></i> Clear all</button>
      <hr class="popup-divider">
      <button id="exportData"><i class="fas fa-download"></i> Export JSON</button>
      <button id="importData"><i class="fas fa-upload"></i> Import JSON</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none">
    </div>
  </div>

  <!-- Handlebars templates -->
  <script id="list-template" type="text/x-handlebars-template">
    <ul class="list">
      {{#each items}}
      <li class="list-item {{#if (startsWith text "-")}}separator{{/if}}" draggable="true" data-index="{{@index}}">
        {{#if (startsWith text "-")}}
          <span class="editable separator-line" data-index="{{@index}}"><span class="sep-title">{{formatSeparator text}}</span></span>
        {{else}}
          <input type="checkbox" {{#if checked}}checked{{/if}} data-index="{{@index}}">
          <span class="editable {{#if checked}}checked{{/if}}" data-index="{{@index}}">{{capitalizeFirst text}}</span>
        {{/if}}
        <span class="grip hidden"><i class="fas fa-grip-lines"></i></span>
        <button class="delete-btn item-delete-btn" data-index="{{@index}}" aria-label="Delete item"><i class="fas fa-trash"></i></button>
        <button class="move-up-btn hidden" data-index="{{@index}}" aria-label="Move up"><i class="fas fa-caret-up"></i></button>
        <button class="move-down-btn hidden" data-index="{{@index}}" aria-label="Move down"><i class="fas fa-caret-down"></i></button>
      </li>
      {{/each}}
    </ul>
  </script>

  <script id="item-edit-template" type="text/x-handlebars-template">
    <input type="text" class="edit-input" data-index="{{index}}" value="{{text}}">
    <button class="save-btn" data-index="{{index}}" aria-label="Save item"><i class="fas fa-save"></i></button>
  </script>

  <script src="assets/js/app.js"></script>
</body>

</html>
